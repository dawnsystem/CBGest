<svg width="1200" height="475" viewBox="0 0 1200 475" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo azul oscuro -->
  <rect width="1200" height="475" fill="#0F172A"/>

  <!-- Patrón de grid sutil -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E3A5F" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F172A;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="475" fill="url(#grid)"/>
  <rect width="1200" height="475" fill="url(#fadeLeft)" opacity="0.7"/>

  <!-- Cubos decorativos izquierda (más oscuros) -->
  <g transform="translate(150, 150) scale(0.8)" opacity="0.15">
    <path d="M40 0 L56 9 L40 18 L24 9 Z" fill="#5A7FAE" />
    <path d="M24 9 L24 27 L40 36 L40 18 Z" fill="#3A5578" />
    <path d="M40 18 L40 36 L56 27 L56 9 Z" fill="#4A6B93" />
    <path d="M24 27 L40 36 L24 45 L8 36 Z" fill="#5A7FAE" />
    <path d="M8 36 L8 54 L24 63 L24 45 Z" fill="#3A5578" />
    <path d="M24 45 L24 63 L40 54 L40 36 Z" fill="#4A6B93" />
    <path d="M40 36 L56 45 L40 54 L24 45 Z" fill="#5A7FAE" />
    <path d="M24 45 L24 72 L40 81 L40 54 Z" fill="#3A5578" />
    <path d="M40 54 L40 81 L56 72 L56 45 Z" fill="#4A6B93" />
    <path d="M56 54 L72 63 L56 72 L40 63 Z" fill="#5A7FAE" />
    <path d="M40 63 L40 81 L56 90 L56 72 Z" fill="#3A5578" />
    <path d="M56 72 L56 90 L72 81 L72 63 Z" fill="#4A6B93" />
  </g>

  <!-- Cubos decorativos derecha (más oscuros) -->
  <g transform="translate(950, 200) scale(0.8)" opacity="0.15">
    <path d="M40 0 L56 9 L40 18 L24 9 Z" fill="#5A7FAE" />
    <path d="M24 9 L24 27 L40 36 L40 18 Z" fill="#3A5578" />
    <path d="M40 18 L40 36 L56 27 L56 9 Z" fill="#4A6B93" />
    <path d="M24 27 L40 36 L24 45 L8 36 Z" fill="#5A7FAE" />
    <path d="M8 36 L8 54 L24 63 L24 45 Z" fill="#3A5578" />
    <path d="M24 45 L24 63 L40 54 L40 36 Z" fill="#4A6B93" />
    <path d="M40 36 L56 45 L40 54 L24 45 Z" fill="#5A7FAE" />
    <path d="M24 45 L24 72 L40 81 L40 54 Z" fill="#3A5578" />
    <path d="M40 54 L40 81 L56 72 L56 45 Z" fill="#4A6B93" />
    <path d="M56 54 L72 63 L56 72 L40 63 Z" fill="#5A7FAE" />
    <path d="M40 63 L40 81 L56 90 L56 72 Z" fill="#3A5578" />
    <path d="M56 72 L56 90 L72 81 L72 63 Z" fill="#4A6B93" />
  </g>

  <!-- Logo principal centrado -->
  <g transform="translate(520, 100) scale(2)">
    <!-- Cubo superior (ventana) -->
    <path d="M40 0 L56 9 L40 18 L24 9 Z" fill="#5A7FAE" />
    <path d="M24 9 L24 27 L40 36 L40 18 Z" fill="#3A5578" />
    <path d="M40 18 L40 36 L56 27 L56 9 Z" fill="#4A6B93" />
    <!-- Ventanas -->
    <rect x="30" y="14" width="4" height="4" fill="#1E3A5F" rx="0.5"/>
    <rect x="36" y="11" width="4" height="4" fill="#1E3A5F" rx="0.5"/>
    <rect x="30" y="20" width="4" height="4" fill="#1E3A5F" rx="0.5"/>
    <rect x="36" y="17" width="4" height="4" fill="#1E3A5F" rx="0.5"/>

    <!-- Cubo C (izquierda medio) -->
    <path d="M24 27 L40 36 L24 45 L8 36 Z" fill="#5A7FAE" />
    <path d="M8 36 L8 54 L24 63 L24 45 Z" fill="#3A5578" />
    <path d="M24 45 L24 63 L40 54 L40 36 Z" fill="#4A6B93" />

    <!-- Cubo B (centro) -->
    <path d="M40 36 L56 45 L40 54 L24 45 Z" fill="#5A7FAE" />
    <path d="M24 45 L24 72 L40 81 L40 54 Z" fill="#3A5578" />
    <path d="M40 54 L40 81 L56 72 L56 45 Z" fill="#4A6B93" />

    <!-- Cubo G (derecha) -->
    <path d="M56 54 L72 63 L56 72 L40 63 Z" fill="#5A7FAE" />
    <path d="M40 63 L40 81 L56 90 L56 72 Z" fill="#3A5578" />
    <path d="M56 72 L56 90 L72 81 L72 63 Z" fill="#4A6B93" />

    <!-- Letras en los cubos -->
    <text x="14" y="52" fill="#1E3A5F" font-size="13" font-weight="bold" font-family="Arial, sans-serif">C</text>
    <text x="30" y="68" fill="#1E3A5F" font-size="14" font-weight="bold" font-family="Arial, sans-serif">B</text>
    <text x="52" y="82" fill="#1E3A5F" font-size="12" font-weight="bold" font-family="Arial, sans-serif">G</text>
  </g>

  <!-- Texto CBGest -->
  <text x="600" y="380" text-anchor="middle" fill="white" font-size="48" font-weight="bold" font-family="Inter, Arial, sans-serif" letter-spacing="2">CBGest</text>

  <!-- Línea decorativa -->
  <rect x="520" y="400" width="160" height="2" fill="#4A6B93" opacity="0.5" rx="1"/>

  <!-- Estrella decorativa inferior derecha -->
  <g transform="translate(1140, 430)">
    <path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" fill="white" opacity="0.6"/>
  </g>
</svg>
