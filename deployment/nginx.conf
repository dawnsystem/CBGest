# ============================================================
# CBGest - Configuración nginx para VPS
# ============================================================
# Copia este fichero a /etc/nginx/sites-available/cbgest
# y actívalo con:
#   sudo ln -s /etc/nginx/sites-available/cbgest /etc/nginx/sites-enabled/cbgest
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reemplaza las variables entre <> con tus valores reales.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    # Usa tu dominio aquí (ej: cbgest.example.com). Las IPs son válidas solo en HTTP.
    server_name <TU_DOMINIO>;

    # Redirigir HTTP → HTTPS (elimina este bloque si no usas HTTPS)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # HTTPS requiere un dominio con certificado SSL. No uses IPs en este bloque.
    server_name <TU_DOMINIO>;

    # Ruta al build de producción de Vite
    root /var/www/cbgest/dist;
    index index.html;

    # --- Certificados SSL (Let's Encrypt recomendado) ---
    # ssl_certificate     /etc/letsencrypt/live/<TU_DOMINIO>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<TU_DOMINIO>/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;

    # ============================================================
    # REGLAS DE CACHÉ — CRÍTICAS para que los cambios se vean en
    # dispositivos móviles (iOS Safari / Android Chrome)
    # ============================================================

    # 1. index.html: NUNCA se cachea.
    #    El navegador siempre pide la versión fresca al servidor.
    #    Los assets JS/CSS tienen hash en el nombre, así que una vez
    #    que el navegador tenga el index.html correcto, descargará
    #    automáticamente los chunks nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        try_files $uri =404;
    }

    # 2. Assets hasheados (JS, CSS generados por Vite con [hash] en el nombre):
    #    Se cachean 1 año. Como el nombre cambia con cada build, nunca
    #    habrá colisión entre versiones distintas.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 3. Recursos estáticos públicos (imágenes, fuentes, favicon):
    #    Caché de 1 día. Tiempo razonable para recursos que cambian poco.
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # 4. SPA fallback: cualquier ruta no encontrada sirve index.html
    #    (necesario para React Router con rutas client-side)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # SEGURIDAD — Cabeceras recomendadas
    # ============================================================
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Ocultar versión de nginx
    server_tokens off;

    # ============================================================
    # GZIP — Compresión para reducir tamaño de transferencia
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;
}
